<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fierritos Shop | Ticket</title>
    <link rel="icon" href="img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/tema.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/comun.js"></script>
    <script defer src="js/ticket.js"></script>
</head>
<body>
    <header class="header">
        <a href="ticket.html" class="brand">
            <img src="img/logo-header.png" alt="Logo Fierritos Shop" class="logo-img" />
            <div>
                <h1>Fierritos Shop</h1>
                <span class="students" id="alumnos"></span>
            </div>
        </a>

        <nav class="navbar">
            <button type="button" class="btn-contacto" id="btnTema">Cambiar tema</button>
            <a href="http://localhost:3000/auth/login" class="btn-contacto" id="linkAdmin">Admin</a>
        </nav>
    </header>

    <main class="page">
        <section class="ticket" id="ticket">
            <div class="ticket-header">
                <img src="img/logo-header.png" alt="Logo Fierritos Shop" class="logo-img" />
                <div>
                    <h2>Fierritos Shop</h2>
                    <p class="cat">¡Gracias por tu compra!</p>
                </div>
            </div>

            <div class="ticket-datos">
                <p><span>N° de venta</span> <strong id="ticketId"></strong></p>
                <p><span>Cliente</span> <strong id="ticketCliente"></strong></p>
                <p><span>Fecha</span> <strong id="ticketFecha"></strong></p>
            </div>

            <table class="ticket-tabla">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Precio</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="ticketProductos"></tbody>
            </table>

            <div class="total-line">
                <span class="total-label">Total</span>
                <span class="total-price" id="ticketTotal"></span>
            </div>
        </section>

        <div class="ticket-acciones">
            <button type="button" class="btn btn-secundario" id="btnPdf">Descargar PDF</button>
            <button type="button" class="btn btn-primary" id="btnSalir">Salir y empezar nueva compra</button>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Fierritos Shop — Autos y Motos a escala.</p>
    </footer>
</body>
</html>
